<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Ventures | Logout</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#06130c;
    color:#fff;
}

.logout-card{
    width:90%;
    max-width:420px;
    padding:30px 24px;
    text-align:center;

    background:#0b1c13;
    border:1px solid #193626;
    border-radius:20px;
}

.icon{
    font-size:50px;
    margin-bottom:15px;
}

h1{
    margin-bottom:10px;
}

p{
    color:#84958b;
    font-size:14px;
    line-height:1.5;
    margin-bottom:22px;
}

.loader{
    width:38px;
    height:38px;

    margin:auto;

    border:4px solid #193626;
    border-top-color:#4ade80;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.small{
    margin-top:15px;
    color:#4ade80;
    font-size:12px;
}
</style>
</head>

<body>

<div class="logout-card">

    <div class="icon">
        👋
    </div>

    <h1>
        Signing you out
    </h1>

    <p>
        Your Ventures session is being securely
        ended. Please wait...
    </p>

    <div class="loader"></div>

    <div class="small">
        Redirecting to login...
    </div>

</div>


<script>

async function logout(){

    const token =
        localStorage.getItem(
            "ventures_token"
        );


    /*
     * Optional backend logout.
     *
     * If your backend doesn't have
     * /api/auth/logout yet, the request
     * simply gets ignored.
     */

    if(token){

        try{

            await fetch(
                "/api/auth/logout",
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " + token
                    }
                }
            );

        }catch(error){

            console.log(
                "Backend logout unavailable."
            );

        }

    }


    /*
     * Remove authentication data.
     */

    localStorage.removeItem(
        "ventures_token"
    );

    localStorage.removeItem(
        "ventures_user"
    );


    /*
     * Remove any temporary
     * session information.
     */

    sessionStorage.clear();


    /*
     * Send user back to login.
     */

    setTimeout(function(){

        window.location.replace(
            "/login.html"
        );

    },800);

}


/* Start logout */

logout();

</script>

</body>
</html>
